    value: p
    method: docs
    source: https://docs.mistral.ai/resources/release-notes
    evidence: |-
      Limited: release notes show MCP Apps rendering in **Vibe surfaces**, but the custom connector docs do not list MCP Apps.

      - The Workflow Visualizer renders as an MCP App inside Vibe (2026-10-14).
      - Studio apps surface in Vibe Code Web through an MCP apps server (2026-11-05).
      - For custom connectors, Studio workflows surface a connector tool `ui://` MCP App *only* with `allow_mcp_ui=True` (default False), and only for direct `call_tool` calls.
