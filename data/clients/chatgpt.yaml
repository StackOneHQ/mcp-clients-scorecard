# ChatGPT. Field reference: data/README.md. After editing, run npm run build.
name: ChatGPT
group: app
tier: A
logo: icon-chatgpt.svg
website: https://chatgpt.com
docs: https://developers.openai.com/apps-sdk
repo: null
tracker: null
cells:
  protocol:
    value: 2026-07-28
    method: docs
    source: https://developers.openai.com/plugins/build/mcp-events
    evidence: 'The MCP Events page says "MCP Events in ChatGPT requires MCP 2.0 (protocol version `2026-07-28`)."'
    checked: 2026-10-30
  code_mode:
    value: n
    method: docs
    source: https://developers.openai.com/api/docs/guides/tools
    evidence: Programmatic Tool Calling ("Let models compose and run JavaScript that orchestrates tool calls") is documented only for the OpenAI API, and no ChatGPT app doc offers it for MCP tools.
    checked: 2026-10-30
  tool_search:
    value: n
    method: docs
    source: https://developers.openai.com/api/docs/guides/tools-connectors-mcp
    evidence: 'Deferred MCP tools with `defer_loading: true` and the hosted tool_search tool are documented for the Responses API only, while the ChatGPT custom MCP server guide says all tools an app exposes are available, with no tool search.'
    checked: 2026-10-30
  apps:
    value: y
    method: docs
    source: https://developers.openai.com/apps-sdk/mcp-apps-in-chatgpt.md
    evidence: The Apps SDK page says "ChatGPT implements the open MCP Apps standard for UI returned by an MCP server."
    checked: 2026-10-30
  tasks:
    value: n
    method: docs
    source: https://developers.openai.com/plugins/build/mcp-server
    evidence: The plugin MCP server, auth and custom MCP server docs never mention io.modelcontextprotocol/tasks, and an open community request for tasks got an OpenAI reply on 2026-09-07 with no timeline.
    checked: 2026-10-30
  events:
    value: p
    method: docs
    source: https://developers.openai.com/plugins/build/mcp-events
    evidence: 'The page says ChatGPT supports "webhook delivery and callback verification" from the draft MCP Events spec, while polling, streaming and the `gap` and `terminated` notifications are not supported, in Work chats only.'
    checked: 2026-10-30
    since:
      date: 2026-09-29
      source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  cimd:
    value: y
    method: docs
    source: https://developers.openai.com/plugins/build/auth
    evidence: The plugin auth page says "ChatGPT prioritizes CIMD when it is available", with DCR as the builder's alternative.
    checked: 2026-10-30
  id_jag:
    value: n
    method: docs
    source: https://developers.openai.com/plugins/build/auth
    evidence: The plugin auth page lists CIMD, DCR, predefined OAuth clients and PKCE with no enterprise-managed auth or ID-JAG, and Okta's Cross App Access partner list (2026-09-24) names no OpenAI app.
    checked: 2026-10-30
  elicitation:
    value: p
    method: docs
    source: https://developers.openai.com/plugins/build/mcp-server
    evidence: 'The plugin MCP server page says "Use MCP elicitation when the server needs structured information that was not provided in the original tool call", without saying whether form or URL mode is meant, so this is p until both modes are confirmed.'
    checked: 2026-10-30
