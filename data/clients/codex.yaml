# Codex. Field reference: data/README.md. After editing, run npm run build.
name: Codex
group: cli
tier: C
logo: icon-codex.svg
website: https://openai.com/codex/
docs: https://developers.openai.com/codex
repo: https://github.com/openai/codex
version_checked: 0.171.0
npm: "@openai/codex"
tracker:
  repo: openai/codex
  mcp_in_title: true
cells:
  protocol:
    value: 2025-06-18
    method: probe
    source: https://github.com/openai/codex/blob/ccf9be8cc458bd6b8336fe84d68d8893f2691a5e/codex-rs/features/src/lib.rs#L1779-L1784
    evidence: |-
      Live probe of 0.171.0 on 2026-11-23: `initialize` carries **2025-06-18**. The `mcp_2026_07_28` feature is still **under development and off by default** (`features/src/lib.rs` at rust-v0.171.0).
    checked: 2026-11-23
  code_mode:
    value: p
    method: docs
    source: https://developers.openai.com/codex/config-reference
    evidence: |-
      `features.code_mode` is **under development and off by default**. It is still `Stage::UnderDevelopment` with `default_enabled` false in `features/src/lib.rs` at rust-v0.169.0 (key `code_mode`, `lib.rs#L1305-L1310`).
    checked: 2026-11-16
    since:
      date: 2026-03-11
      version: "0.114.0"
      source: https://github.com/openai/codex/releases/tag/rust-v0.114.0
  tool_search:
    value: y
    label: BM25
    quality: strong
    method: source
    source: https://github.com/openai/codex/blob/6ff1e1ca3b30fc8b914720681fcf5fe62e95f856/codex-rs/core/src/tools/handlers/tool_search.rs#L171
    evidence: |-
      When the model supports the search tool, MCP tools are deferred and `tool_search` ranks them with **BM25**.

      - It uses the `bm25` crate, English, fit to the corpus.
      - The indexed text is each tool name, the name with underscores as spaces, description, parameter names and descriptions, plus namespace name and description.
    checked: 2026-10-30
    since:
      date: 2026-04-10
      version: "0.119.0"
      source: https://github.com/openai/codex/releases/tag/rust-v0.119.0
  apps:
    value: na
    method: probe
    source: https://github.com/openai/codex/issues/52524
    evidence: |-
      Live probe of 0.171.0 declares **no** `io.modelcontextprotocol/ui` extension.

      - `enable_mcp_apps` is under development and off by default.
      - App rendering reports come from Codex Desktop, *not* the CLI.
    checked: 2026-11-23
  tasks:
    value: n
    method: probe
    source: https://github.com/openai/codex/issues/48617
    evidence: "Live probe of 0.171.0 declares no tasks capability, and the feature request is still open"
    checked: 2026-11-23
  events:
    value: n
    method: source
    source: https://github.com/openai/codex/blob/d32063f96c2dff1dc96af839b3952abb6acfeda4/codex-rs/codex-mcp/src/resource_client.rs#L373
    evidence: |-
      `events/list` and `events/stream` are sent **only to the built-in `codex_apps` hosted server**, not to user-configured MCP servers. Issue 49665 about event subscriptions is still open.
    checked: 2026-11-16
  skills:
    value: n
    method: issue
    source: https://github.com/openai/codex/issues/48000
    evidence: |-
      Issue #48000 "support SEP-2640: Skills Extension" is **open** (created 2026-09-25), with no linked PR; the `skills/list` in the repo is Codex's own app-server method for local skills.
    checked: 2026-11-26
  cimd:
    value: y
    method: docs
    source: https://developers.openai.com/codex/mcp
    evidence: Docs say Codex **picks CIMD** when the authorization server advertises `client_id_metadata_document_supported`, otherwise DCR
    checked: 2026-10-30
    since:
      date: 2026-08-18
      version: "0.148.0"
      source: https://github.com/openai/codex/releases/tag/rust-v0.148.0
  id_jag:
    value: p
    method: source
    source: https://github.com/openai/codex/blob/ccf9be8cc458bd6b8336fe84d68d8893f2691a5e/codex-rs/features/src/lib.rs#L1833-L1838
    evidence: |-
      Enterprise-managed authorization (PR 55334) runs only with `use_xaa`, which is **under development and off by default** in 0.171.0.

      - It needs an enterprise-managed auth config on the server.
      - `connection_manager.rs` then forces the 2026-07-28 protocol for that server.
    checked: 2026-11-23
    since:
      date: 2026-10-23
      version: "0.164.0"
      source: https://github.com/openai/codex/releases/tag/rust-v0.164.0
  elicitation:
    value: y
    method: probe
    source: https://github.com/openai/codex/pull/22188
    evidence: "Live probe of 0.171.0 declares elicitation form and url"
    checked: 2026-11-23
    since:
      date: 2025-12-02
      version: "0.64.0"
      source: https://github.com/openai/codex/releases/tag/rust-v0.64.0
  list_changed:
    value: p
    method: source
    source: https://github.com/openai/codex/blob/ccf9be8cc458bd6b8336fe84d68d8893f2691a5e/codex-rs/features/src/lib.rs#L1785-L1790
    evidence: |-
      Re-listing on the notification sits behind the feature flag `mcp_tool_list_changed` (`Stage::UnderDevelopment`, `default_enabled` false). Without the flag the notification is *only* logged.
    checked: 2026-11-23
