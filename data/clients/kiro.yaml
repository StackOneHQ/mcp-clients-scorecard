website: https://kiro.dev
docs: https://kiro.dev/docs/mcp/
repo: https://github.com/kirodotdev/Kiro
version_checked: 3.5.0
tracker:
  repo: kirodotdev/Kiro
  mcp_in_title: true
cells:
  protocol:
    value: 2026-07-28
    method: source
    source: https://desktop-release.q.us-east-1.amazonaws.com/3.5.0/kirocli-x86_64-linux.zip
    evidence: |-
      Binary: the Kiro CLI 3.5.0 MCP SDK carries a `server/discover` lifecycle with **2026-07-28** and legacy fallback strings.

      - Binary is `kirocli/bin/kiro-cli` (BUILD_DATE 2026-11-17).
      - Strings include "server/discover rejected with HTTP", `NoCompatibleProtocolVersion` and `LegacyFallbackFailed`.
      - Docs name no revision.
      - The live handshake could not be run without a Kiro login, and the IDE build was not inspected.
    checked: 2026-11-22
  code_mode:
    value: n
    method: docs
    source: https://kiro.dev/docs/mcp/
    evidence: "Docs: the MCP docs and tool pages describe one tool call per step, with **no code mode**; not documented."
    checked: 2026-11-22
  tool_search:
    value: y
    label: Catalog
    quality: basic
    method: docs
    source: https://kiro.dev/docs/mcp/tool-search/
    evidence: |-
      Docs: Kiro gives the model a **deferred tool catalog** and loads schemas on demand.

      - Kiro indexes tool names and descriptions; the model loads a needed tool's full schema with `tool_load` by exact ID.
      - **On by default** in IDE 1.3 and local V3 CLI 2.31, opt-in in V2.
      - The docs do not describe a ranked search.
    checked: 2026-11-22
    since:
      date: 2026-10-13
      version: "1.3.0"
      source: https://kiro.dev/changelog/ide/1-3/
  apps:
    value: n
    method: issue
    source: https://github.com/kirodotdev/Kiro/issues/11048
    evidence: |-
      Open feature request for native MCP Apps (`ui://` resources) in chat; the MCP docs list **no Apps support**. A maintainer logged it as a feature request on 2026-09-21.
    checked: 2026-11-22
  tasks:
    value: n
    method: docs
    source: https://kiro.dev/docs/mcp/
    evidence: "Docs: the MCP docs list tools, prompts, resources and elicitation and **no tasks support**; not documented."
    checked: 2026-11-22
  events:
    value: n
    method: docs
    source: https://kiro.dev/docs/mcp/
    evidence: "Docs: the MCP docs describe **no server-pushed events**; not documented."
    checked: 2026-11-22
  cimd:
    value: y
    method: docs
    source: https://kiro.dev/docs/mcp/configuration/
    evidence: |-
      Docs: Kiro signs in with its **own hosted Client ID Metadata Document** when the authorization server supports it and offers no registration endpoint.

      - Hosted document: https://kiro.dev/oauth/client-metadata.json; `oauth.clientMetadataUrl` sets your own.
      - Needs **CLI 3.2.0** and IDE 1.4.178 or later, otherwise DCR.
    checked: 2026-11-22
    since:
      date: 2026-11-10
      version: "3.2.0"
      source: https://kiro.dev/changelog/cli/3-2/
  id_jag:
    value: y
    method: docs
    source: https://kiro.dev/docs/mcp/configuration/
    evidence: |-
      Docs: from **IDE 1.4.236 and CLI 3.5.0**, eligible HTTP MCP servers share one organization sign-in through the company's identity provider.

      - Config uses `identityProvider` issuer and `clientId`, with `oauth.mode` set to `enterprise` or `auto`.
      - Access is the organization's grant.
      - The docs never use the name ID-JAG, but the 3.5.0 binary's bundled docs index tags `kiro-cli mcp idp` with enterprise-managed authorization and `id-jag`.
    checked: 2026-11-22
  elicitation:
    value: y
    method: docs
    source: https://kiro.dev/docs/mcp/usage/
    evidence: |-
      Docs: Kiro supports **form and URL elicitation**.

      - Form elicitation renders an inline form (text, number, yes or no, choice).
      - URL elicitation shows the link with an Open button.
      - Documented for local V3 CLI sessions from **2.34**; the MCP overview lists elicitation for the IDE.
    checked: 2026-11-22
    since:
      date: 2026-10-23
      version: "2.34.0"
      source: https://kiro.dev/changelog/cli/2-34/
  list_changed:
    value: p
    method: issue
    source: https://github.com/kirodotdev/Kiro/issues/6553
    evidence: |-
      Limited: an issue reported the Kiro IDE ignoring `notifications/tools/list_changed`, closed as **resolved in CLI 2.14.0**.

      - The maintainer closed it on 2026-07-23; Kiro re-queries `tools/list` (the V3 regression is fixed too).
      - The reporter's question about which IDE version has the fix is unanswered.
    checked: 2026-11-22
