    source: https://github.com/microsoft/vscode/blob/2c33b50b16c472efe58357d1d2a8a5414bc23fbf/extensions/copilot/src/extension/tools/node/toolSearchTool.ts
    evidence: |-
      Source: deferred tools are found with a `tool_search` tool that ranks them by **embeddings** from a remote service.

      - On for models with `supportsToolSearch` (`agentIntent.ts:277`).
      - `toolSearchTool.ts` calls `searchToolsByQuery`, which embeds the query and each tool's name plus description.
      - Embeddings come from the remote GitHub embeddings service (`metis-1024-I16-Binary` by default), ranked by dot product, top 5 by default (`toolEmbeddingsComputer.ts:136-202`).
