    method: source
    source: https://github.com/aaif-goose/goose/blob/v1.57.0/crates/goose/src/agents/mcp_client.rs#L358
    evidence: |-
      `on_tool_list_changed` bumps `tools_version` (L208), so `extension_manager public_tools` sees a stale cache and **lists tools again**.

      - The new tool reaches the model on the next turn.
    checked: 2026-11-02
