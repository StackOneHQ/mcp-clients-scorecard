cells:
  protocol:
    value: 2026-07-28
    method: probe
    source: https://github.com/aaif-goose/goose/blob/30bba95105e59bc3e7df624cf6b4d433690cfe12/crates/goose/src/agents/mcp_client.rs#L549
    evidence: |-
      Own probe of the goose CLI 1.57.0 release binary on 2026-10-30: `server/discover` with **2026-07-28** first, then `initialize` with **2025-11-25**.

      - The first request carried `protocolVersion` 2026-07-28, and the fallback to `initialize` came when the server rejected it.
      - This matches `mcp_client.rs:549-555` `ClientLifecycleMode::Auto` with `legacy_version` 2025-11-25.
    checked: 2026-10-30
    fallback: 2025-11-25
  code_mode:
    value: y
    method: docs
    source: https://github.com/aaif-goose/goose/blob/30bba95105e59bc3e7df624cf6b4d433690cfe12/documentation/docs/guides/managing-tools/code-mode.md#L25
    evidence: |-
      Code Mode is a documented built-in extension, **off by default** but enabled by a documented setting and not marked experimental, so y under the methodology.

      - It is defined in `platform_extensions/mod.rs:159-162` with `default_enabled` false, and the user turns it on in settings or `goose configure`.
      - It exposes `list_functions`, `get_function_details` and `execute_javascript` running in a Boa JavaScript context (`code_execution.rs:277-279`).
      - Unchanged in 1.57.0, still the latest release on 2026-11-06.
    checked: 2026-11-06
    since:
      date: 2025-12-18
      version: "1.17.0"
      source: https://github.com/aaif-goose/goose/releases/tag/v1.17.0
  tool_search:
    value: y
    label: LLM picks
    quality: basic
    method: docs
    source: https://github.com/aaif-goose/goose/blob/fb55b5a6d7f5b5df96c8f817f1cde6a81880d9f1/documentation/docs/guides/config-files.md#L54
    evidence: |-
      Since **v1.59.0** the documented setting `GOOSE_TOOL_DEFERRAL=lookup` publishes MCP tool names up front and the model calls `enable_tools` to load schemas, *off* when unset.

      - PR 13378 (minimal deferred MCP tools) added it.
      - There is no query or ranking, so the model picks from the name list.
      - Code Mode also loads schemas by exact name (`list_functions`, then `get_function_details`, `code_execution.rs:277-278` at v1.57.0).
    checked: 2026-11-23
    since:
      date: 2025-12-18
      version: "1.17.0"
      source: https://github.com/aaif-goose/goose/releases/tag/v1.17.0
  apps:
