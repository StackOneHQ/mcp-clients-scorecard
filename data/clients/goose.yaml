    method: source
    source: https://github.com/aaif-goose/goose/blob/30bba95105e59bc3e7df624cf6b4d433690cfe12/crates/goose/src/agents/mcp_client.rs#L47
    evidence: |-
      The ui extension is declared but **enabled for goose Desktop and off for the CLI** (`agent.rs:262-263`).

      - `mcp_client.rs:47-59` declares the `io.modelcontextprotocol/ui` extension with mimeTypes `text/html;profile=mcp-app`.
      - The CLI probe declared `extensions {}` as expected.
    checked: 2026-10-30
    since:
