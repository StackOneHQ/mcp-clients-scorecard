    value: 2025-11-25
    method: source
    source: https://github.com/Kilo-Org/kilocode/blob/2aa002cc0ab69d89f591f8174631152efa720877/bun.lock#L1923
    evidence: |-
      Source: the pinned MCP SDK 1.32.1 defaults to protocol **2025-11-25**.

      - `packages/opencode/package.json:109` pins `@modelcontextprotocol/sdk` 1.32.1 (`bun.lock:1923`).
      - Its `LATEST_PROTOCOL_VERSION` is 2025-11-25 (`dist/esm/types.js:2` in that package).
      - The patch in `patches/` only adds `determineScope` to auth.
    checked: 2026-11-22
  code_mode:
    value: p
    method: source
    source: https://github.com/Kilo-Org/kilocode/blob/2aa002cc0ab69d89f591f8174631152efa720877/packages/opencode/src/effect/runtime-flags.ts#L58
    evidence: |-
      Source: code mode is **experimental and off by default**, behind `KILO_EXPERIMENTAL_CODE_MODE`.

      - The `KILO_EXPERIMENTAL` umbrella or `experimental.code_mode` in config also turns it on.
      - When on, `session/tools.ts:471` stops exposing MCP tools directly and `tool/code-mode.ts` routes them through a script runtime.
    checked: 2026-11-22
    since:
      date: 2026-08-13
      version: "7.4.22"
      source: https://github.com/Kilo-Org/kilocode/releases/tag/v7.4.22
  tool_search:
    value: p
    method: source
    source: https://github.com/Kilo-Org/kilocode/blob/2aa002cc0ab69d89f591f8174631152efa720877/packages/codemode/src/tool-runtime.ts#L386
    evidence: |-
      Source: tool search exists only **inside the experimental code mode**, and is not available with code mode off.

      - A budgeted catalog points the model to a search tool.
      - It scores path, description and parameter text by substring weights: exact path 20, path substring 8, description 4, other text 2.
    checked: 2026-11-22
    label: Keyword
    quality: basic
    since:
