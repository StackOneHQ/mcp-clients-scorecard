# Auggie. Field reference: data/README.md. After editing, run npm run build.
name: Auggie
group: cli
tier: C
logo: gh-augmentcode.png
website: https://www.augmentcode.com
docs: https://docs.augmentcode.com/cli/integrations
repo: null
version_checked: "1.2.3"
npm: "@augmentcode/auggie"
tracker:
  repo: augmentcode/auggie
  mcp_in_title: true
cells:
  protocol:
    value: 2025-11-25
    method: source
    source: https://registry.npmjs.org/@augmentcode/auggie/-/auggie-1.2.2.tgz
    evidence: |-
      The 1.2.2 package bundle sends `initialize` with **2025-11-25** and has no 2026-07-28 handling.

      - Source: `auggie-v2.mjs.d/extensions/mcp/index.js`.
      - 2025-11-25 is the bundled MCP SDK's `LATEST_PROTOCOL_VERSION`.
      - It accepts 2025-06-18, 2025-03-26, 2024-11-05 and 2024-10-07.
    checked: 2026-11-22
  code_mode:
    value: n
    method: docs
    source: https://docs.augmentcode.com/cli/integrations
    evidence: |-
      The MCP docs document **no script-calling code mode**.

      - They describe only direct tool calls and the `find-tool` and `execute-tool` meta-tools.
      - Those meta-tools run one MCP tool at a time.
    checked: 2026-11-22
  tool_search:
    value: p
    label: LLM
    quality: strong
    method: docs
    source: https://docs.augmentcode.com/cli/integrations
    evidence: |-
      Docs: MCP Tool Search is **disabled by default** and, once on, hides MCP tools behind `find-tool` and `execute-tool`.

      - Turned on with `--enable-tool-search` or `enableToolSearch` in `settings.json`.
      - `find-tool` asks a lightweight model to pick the best tool on a server.
    checked: 2026-11-22
  apps:
    value: na
    method: source
    source: https://registry.npmjs.org/@augmentcode/auggie/-/auggie-1.2.2.tgz
    evidence: |-
      Terminal CLI, and the 1.2.2 MCP client **declares no capabilities**.

      - No `io.modelcontextprotocol/ui` extension is declared.
      - The bundle has no `ui://` resource handling.
    checked: 2026-11-22
  tasks:
    value: n
    method: source
    source: https://registry.npmjs.org/@augmentcode/auggie/-/auggie-1.2.2.tgz
    evidence: The 1.2.2 MCP client is created with an empty capabilities object, so it **declares no `tasks` capability**
    checked: 2026-11-22
  events:
    value: n
    method: source
    source: https://registry.npmjs.org/@augmentcode/auggie/-/auggie-1.2.2.tgz
    evidence: The 1.2.2 MCP client declares no capabilities and registers **no handler for server-pushed events** beyond the list-changed notification
    checked: 2026-11-22
  skills:
    value: n
    method: docs
    source: https://docs.augmentcode.com/cli/integrations
    evidence: |-
      Docs: the Auggie CLI integrations page and changelog **do not mention skills served by MCP servers** (no `skills/list`, `skill://` or SEP-2640).
    checked: 2026-11-26
  cimd:
    value: n
    method: source
    source: https://registry.npmjs.org/@augmentcode/auggie/-/auggie-1.2.2.tgz
    evidence: |-
      Auggie **never sets `clientMetadataUrl`** in the 1.2.2 bundle.

      - The only `clientMetadataUrl` code is the MCP SDK's OAuth helper, and Auggie's own MCP code never sets it.
      - The MCP docs do not mention it.
    checked: 2026-11-22
  id_jag:
    value: n
    method: docs
    source: https://docs.augmentcode.com/cli/integrations
    evidence: The MCP docs list header-based auth for http servers and **do not mention enterprise-managed authorization** (ID-JAG)
    checked: 2026-11-22
  elicitation:
    value: n
    method: source
    source: https://registry.npmjs.org/@augmentcode/auggie/-/auggie-1.2.2.tgz
    evidence: |-
      The 1.2.2 MCP client **never advertises elicitation**.

      - It is created with an empty capabilities object.
      - It has no `elicitation/create` request handler.
    checked: 2026-11-22
  list_changed:
    value: y
    method: source
    source: https://registry.npmjs.org/@augmentcode/auggie/-/auggie-1.2.2.tgz
    evidence: The 1.2.2 MCP extension registers a `notifications/tools/list_changed` handler that **re-lists the server's tools** and updates the agent's cached tool list
    checked: 2026-11-22
