website: https://claude.com/product/overview
docs: https://claude.com/docs/connectors/building
repo: https://github.com/anthropics/claude-ai-mcp
tracker:
  repo: anthropics/claude-ai-mcp
  mcp_in_title: false
cells:
  protocol:
    value: 2026-07-28
    method: source
    source: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_6.28899.6_amd64.deb
    evidence: |-
      Source: Claude Desktop 6.28899.6 **tries 2026-07-28 first** for remote connectors and for extensions on its built-in Node, and falls back to 2025-11-25.

      - Read in `app.asar` of the official Linux package (sha256 checked against the apt index), `.vite/build/index.chunk-DqepnCaA.js`.
      - Remote connectors connect with `versionNegotiation: { mode: "auto" }`: `server/discover` on 2026-07-28, then `initialize` on "2025-11-25" if the server does not answer it.
      - Desktop extensions on the built-in Node get the same check from a separate era probe. Other local stdio servers start on 2025-11-25 (*"exec lane pinned"*).
      - A remote feature flag (`1942337209`) turns all of this back to 2025-11-25. It is off by default.
      - *Not* probed live: the app starts MCP servers only after sign-in. The connector docs still publish no version.
    checked: 2026-11-27
    fallback: 2025-11-25
  code_mode:
    value: n
    method: changelog
    source: https://claude.com/docs/cowork/changelog
    evidence: |-
      Neither the connector docs nor the Claude Desktop and Cowork changelog mention a **code mode** for MCP tools.

      - The changelog check runs through v4.23118.0 (2026-11-05).
      - The Claude Code 2.1.318 experiment is *not* exposed in the app.
    checked: 2026-11-06
  tool_search:
    value: y
    label: Deferred
    quality: strong
    method: docs
    source: https://support.claude.com/en/articles/13730515-manage-claude-s-tool-access
    evidence: |-
      The default Auto mode lets Claude decide "dynamically which connectors to load", and **ranking is not documented**. On demand mode loads no connector "until Claude searches for the right one based on your request".
    checked: 2026-10-30
  apps:
    value: y
    method: docs
    source: https://claude.com/docs/connectors/building/mcp-apps/getting-started
    evidence: The MCP Apps getting-started page describes an MCP App as interactive UI "that your MCP server renders inside a Claude conversation", built with the MCP Apps SDK.
    checked: 2026-10-30
    since:
      date: 2026-01-26
      source: https://claude.com/resources/articles/interactive-tools-in-claude
  tasks:
    value: y
    method: docs
    source: https://code.claude.com/docs/en/mcp
    evidence: |-
      Docs: MCP tasks **work in claude.ai chats** with connectors that support them on protocol revision 2026-07-28.

      - The page lists "New chats in the unified Claude experience on Pro, Max, Ultra, and Team plans", and adds that not every existing chat has tasks.
      - [Anthropic's 2026-11-24 announcement](https://claude.com/resources/articles/skills-over-mcp-tasks-and-more) calls Tasks *generally available*, rolling out to Enterprise.
    checked: 2026-11-27
    since:
      date: 2026-11-24
      source: https://claude.com/resources/articles/skills-over-mcp-tasks-and-more
  events:
    value: n
    method: docs
    source: https://claude.com/docs/connectors/building
    evidence: |-
      The connector build page says Claude **"doesn't yet support"** resource subscriptions, sampling, or advanced or draft capabilities. Nothing documents MCP Events.
    checked: 2026-10-30
  skills:
    value: y
    method: docs
    source: https://claude.com/resources/articles/skills-over-mcp-tasks-and-more
    evidence: |-
      Announcement: skills over MCP are in **public beta in Claude, on by default for Pro, Max and Ultra**.

      - Team plans get it on request; Enterprise is listed as coming.
      - Open issue [claude-ai-mcp#1160](https://github.com/anthropics/claude-ai-mcp/issues/1160) reports that *Cowork* does not run served skills yet.
    checked: 2026-11-26
    since:
      date: 2026-11-24
      source: https://claude.com/resources/articles/skills-over-mcp-tasks-and-more
  cimd:
    value: y
    method: docs
    source: https://claude.com/docs/connectors/building/authentication
    evidence: |-
      The authentication page lists `oauth_cimd` as **"Supported by default"**.

      - It is used when the authorization server advertises `client_id_metadata_document_supported` and `none` auth.
      - Otherwise Claude falls back to DCR.
    checked: 2026-10-30
  id_jag:
    value: y
    method: docs
    source: https://claude.com/docs/connectors/building/enterprise-managed-auth
    evidence: |-
      The Enterprise Managed Auth page documents the flow, and the announcement says it became **generally available on 2026-08-24**.

      - Claude exchanges a signed identity assertion from the IdP at the server's token endpoint with the JWT bearer grant.
      - This follows the MCP enterprise managed authorization extension.
    checked: 2026-10-30
    since:
      date: 2026-06-18
      source: https://claude.com/resources/articles/enterprise-managed-auth
  elicitation:
    value: n
    method: issue
    source: https://github.com/anthropics/claude-ai-mcp/issues/1085
    evidence: |-
      Cowork declares `elicitation` with `form` and `url` but **never renders the request**.

      - Still reproducing on 2.1.310 on 2026-10-25.
      - The claude.ai request for elicitation (issue 153) is still open.
      - The connector docs list no elicitation support.
    checked: 2026-10-30
  list_changed:
    value: n
    method: issue
    source: https://github.com/anthropics/claude-ai-mcp/issues/45
    evidence: |-
      Open, labelled bug, known-issue and backlog: the app **keeps a stale cached list** after `notifications/tools/list_changed`. The app requests `tools/list`, but the new tool cannot be called.
    checked: 2026-11-02
