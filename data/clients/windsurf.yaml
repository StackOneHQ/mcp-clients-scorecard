    evidence: |-
      Source: the 3000.11.234 binary **ships a tool search tool**, described as "Only a core set of tools is shown to you".

      - `tool_search` is defined in `toolbox-core/src/tools/tool_search.rs`.
      - It takes `query` (matched against tool names, descriptions and parameter names), exact `names` and `limit` (default 6, max 12), and loads the matches for the next turn.
