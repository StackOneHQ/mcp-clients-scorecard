    evidence: "ToolSearch (flag mcp_tool_search, default true) loads deferred MCP tools by select:<name> or by keywords matched against tool-name words only, scored as matched name tokens over max(name tokens, query words) with a small synonym map, returning the top-scoring ties; docs only say tools load on demand, ranking not documented"
    checked: 2026-11-02
