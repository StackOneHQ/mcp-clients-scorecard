# Droid. Field reference: data/README.md. After editing, run npm run build.
name: Droid
group: cli
tier: A
logo: gh-Factory-AI.png
website: https://factory.com
docs: https://docs.factory.com
repo: https://github.com/Factory-AI/factory
version_checked: 1.17.2
npm: "@factory/cli"
tracker:
  repo: Factory-AI/factory
  mcp_in_title: true
cells:
  protocol:
    value: 2025-11-25
    method: probe
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.17.2
    evidence: |-
      Live probe of 1.17.2 on 2026-11-23 negotiated **2025-11-25** (clientInfo `factory-cli`).

      - The 1.17.2 binary still ships flag `mcp_2026_07_28`, **off by default**.
    checked: 2026-11-23
  code_mode:
    value: p
    method: source
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: |-
      The `Script` tool runs JavaScript that calls MCP tools as `tools.<server>.<tool>`.

      - In the 1.12.1 binary the execution mode is `direct_only` **unless the model is listed** in the server-side `script_tool_models` config (default empty list) or the hidden exec flag `--tool-execution-mode script-only` overrides it.
      - This is the same logic as the 1.6.0 binary.
      - Release notes mention Script from CLI v0.233.0 (October 3, 2026, Script output trimming), but the MCP docs do not.
    checked: 2026-11-16
  tool_search:
    value: y
    label: Keyword
    quality: basic
    method: source
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: |-
      `ToolSearch` (flag `mcp_tool_search`, default true) loads deferred MCP tools by `select:<name>` or by **keywords matched against tool-name words only**.

      - Scoring is matched name tokens over max(name tokens, query words) with a small synonym map, returning the top-scoring ties.
      - Docs only say tools load on demand, ranking not documented.
    checked: 2026-11-16
    since:
      date: 2026-06-03
      version: "0.140.0"
      source: https://docs.factory.com/changelog/release-notes
  apps:
    value: na
    method: source
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: |-
      **0 hits** for `io.modelcontextprotocol/ui` or `ui://` in the 1.12.1 binary.
    checked: 2026-11-16
  tasks:
    value: n
    method: source
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: |-
      **0 hits** for `io.modelcontextprotocol/tasks` in the 1.12.1 binary.

      - `tasks/get` appears only in bundled SDK schemas.
      - The probe saw no tasks capability.
    checked: 2026-11-16
  events:
    value: n
    method: source
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: |-
      **0 hits** for `events/subscribe` or `notifications/events` in the 1.12.1 binary.
    checked: 2026-11-16
  cimd:
    value: y
    method: docs
    source: https://docs.factory.com/harness/mcp
    evidence: |-
      Docs: Droid uses Factory's published client metadata when the server supports **Client ID Metadata Documents (CIMD)**.

      - The 1.12.1 binary handles a `clientMetadataUrl` override.
    checked: 2026-11-16
    since:
      date: 2026-06-12
      version: "0.147.0"
      source: https://docs.factory.com/changelog/release-notes
  id_jag:
    value: n
    method: source
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: Only bundled SDK schemas for the ID-JAG token exchange in the 1.12.1 binary, with **no product wiring**.
    checked: 2026-11-16
  elicitation:
    value: n
    method: probe
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: |-
      Live probe of 1.12.1 declared `capabilities {}`, so **no elicitation**.

      - The binary builds its MCP client with no capabilities option, so no `elicitation/create` handler can register.
      - This outranks the v0.112.0 (April 2026) changelog line Resume MCP elicitations.
    checked: 2026-11-16
  list_changed:
    value: y
    method: source
    source: https://registry.npmjs.org/@factory/cli-linux-x64/1.12.1
    evidence: |-
      The 1.12.1 binary registers `setNotificationHandler("notifications/tools/list_changed")` on each server, with **no flag**.

      - The handler logs `Received ToolListChanged`, clears that server's tool cache and calls `handleToolsListChanged` to refresh and broadcast the new tool set.
      - The live probe of 1.12.1 on 2026-11-16 sent a fresh `tools/list` after the notice on the same server process.
      - The MCP docs do not mention it.
    checked: 2026-11-16
