# Claude Code. Field reference: data/README.md. After editing, run npm run build.
name: Claude Code
group: cli
tier: S
logo: icon-claude.svg
website: https://claude.com/product/claude-code
docs: https://code.claude.com/docs/en/overview
repo: https://github.com/anthropics/claude-code
version_checked: 2.1.330
npm: "@anthropic-ai/claude-code"
tracker:
  repo: anthropics/claude-code
  mcp_in_title: true
cells:
  protocol:
    value: 2026-07-28
    method: probe
    source: https://code.claude.com/docs/en/changelog
    evidence: "Live probe of 2.1.330 on 2026-11-23: server/discover carries 2026-07-28"
    checked: 2026-11-23
  code_mode:
    value: p
    method: docs
    source: https://code.claude.com/docs/en/code-mode
    evidence: |-
      Docs: Code Mode ships **experimental and off by default**.

      - Turned on with `CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1`; needs **v2.1.323** or later, the Anthropic API and an interactive terminal.
      - Changelog 2.1.323 adds Code Mode, an experimental opt-in in which Claude writes JavaScript to call its tools.
      - The 2.1.325 bundle still refuses it when the server-side gate "isn't open to your account yet".
      - The 2.1.319 bundle already carried it behind the same flag, so the first release is not dated.
    checked: 2026-11-16
  tool_search:
    value: y
    label: Keyword
    quality: strong
    method: source
    source: https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/2.1.325
    evidence: |-
      Docs: tool search is **on by default** and defers MCP tools behind a search tool.

      - Controlled by `ENABLE_TOOL_SEARCH` with `true`, `auto`, `auto:N` or `false`.
      - The 2.1.325 bundle ranks by exact name, `select:` and `mcp__` prefix lookups first.
      - Then it applies weighted keyword scoring over server and tool name parts, plus a word-boundary match on description and search hint.
      - It uses no BM25 or embeddings.
    checked: 2026-11-16
    since:
      date: 2026-01-14
      version: "2.1.7"
      source: https://github.com/anthropics/claude-code/releases/tag/v2.1.7
  apps:
    value: na
    method: probe
    source: https://github.com/anthropics/claude-code/issues/95149
    evidence: |-
      Live probe of 2.1.325 declares **no MCP Apps extension** (`io.modelcontextprotocol/ui`).

      - The bundle adds it only under an undocumented environment variable.
      - The feature request is still open.
    checked: 2026-11-16
  tasks:
    value: y
    method: docs
    source: https://code.claude.com/docs/en/mcp
    evidence: |-
      Docs: MCP tasks are **public beta from v2.1.304**.

      - Anthropic feature flags turn them on for terminal, Agent SDK and GitHub Actions sessions on 2026-07-28 connections.
      - A one-shot `claude -p` run does not get them, which is why the unauthenticated `-p` probe saw no tasks.
    checked: 2026-10-30
    since:
      date: 2026-10-19
      version: "2.1.304"
      source: https://code.claude.com/docs/en/mcp
  events:
    value: n
    method: issue
    source: https://github.com/anthropics/claude-code/issues/101434
    evidence: "**Open feature request** to start routines from MCP events; channels are a Claude-specific push path, not the working group design"
    checked: 2026-11-16
  cimd:
    value: y
    method: docs
    source: https://code.claude.com/docs/en/mcp
    evidence: Docs list **Client ID Metadata Document** support, and the 2.1.81 release note names CIMD (SEP-991)
    checked: 2026-10-30
    since:
      date: 2026-03-20
      version: "2.1.81"
      source: https://github.com/anthropics/claude-code/releases/tag/v2.1.81
  id_jag:
    value: y
    method: docs
    source: https://blog.modelcontextprotocol.io/posts/enterprise-managed-auth
    evidence: |-
      The MCP blog says Anthropic implemented **enterprise-managed authorization**, a documented admin policy, so this counts as `y`.

      - Admins can authorize MCP servers across Claude, Claude Code and Cowork.
      - Setting up XAA locally in the CLI without that policy needs an undocumented switch.
    checked: 2026-10-30
  elicitation:
    value: y
    method: probe
    source: https://code.claude.com/docs/en/mcp
    evidence: Live probe of 2.1.325 declares `elicitation` **form and url**, matching the docs
    checked: 2026-11-16
    since:
      date: 2026-03-14
      version: "2.1.76"
      source: https://github.com/anthropics/claude-code/releases/tag/v2.1.76
  list_changed:
    value: y
    method: changelog
    source: https://github.com/anthropics/claude-code/blob/80c6959d28c4c30ecd14fc1cdf172f19d9adad81/CHANGELOG.md#L8529
    evidence: '2.1.0: "Added support for MCP `list_changed` notifications, allowing MCP servers to dynamically update their available tools, prompts, and resources without requiring reconnection"'
    checked: 2026-11-02
