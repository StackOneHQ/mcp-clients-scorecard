# On every push, main included, rebuild the README sections, EVIDENCE.md, the history
# snapshot, the badges and the PNG charts from data/, and commit the result back to that branch.
# A merged pull request that only edits data/ therefore gets its tables and charts redrawn on main.
# Commits made with GITHUB_TOKEN start no new push runs, so this cannot loop. It then starts
# the check workflow on the new commit, because a GITHUB_TOKEN push does not start it either.
# On main, Cloudflare Workers Builds deploys the website, and the live job checks it serves that commit (README.md#website).
name: build
on:
  push:
    branches: ['**']
  # Rebuild by hand
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: build-${{ github.ref }}
  # main queues instead of cancelling, so a run is never stopped halfway through its push
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # The commit this job tested and that main now points at; empty when a newer push will rebuild
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The branch tip, not the pushed commit: a queued run then builds on the previous run's commit
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # wrangler is a dev dependency for local previews only; keep its install scripts away from this job's write token
      - run: npm ci --omit=dev
      - name: Build tables and charts
        run: CHROME_PATH="$(command -v google-chrome)" npm run build
      - name: Commit generated files
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add README.md EVIDENCE.md data/history assets
          if git diff --cached --quiet; then
            echo "Generated files already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate tables and charts from data/"
          if ! git push origin "HEAD:refs/heads/$BRANCH" 2> "$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err" >&2
            # A rejected push is only fine when it lost a race: someone pushed while this ran, and their
            # push queued a run that rebuilds from the new tip. Anything else, such as branch protection,
            # fails the run, even if the branch also moved.
            git fetch -q origin "$BRANCH"
            grep -qE "fetch first|non-fast-forward" "$RUNNER_TEMP/push.err" || exit 1
            [ "$(git rev-parse FETCH_HEAD)" != "$BASE" ] || exit 1
            echo "::notice::$BRANCH moved during the build; the queued run regenerates from the new tip"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        # Best effort: the npm run check and npm test steps below already validate this commit
        run: gh workflow run check.yml --ref "$BRANCH" || echo "::warning::Could not start the check workflow on the regenerated commit"
      - run: npm run check
      - run: npm test
  live:
    # Cloudflare Workers Builds deploys every push to main (README.md#website). This job only checks
    # that mcpclients.dev ends up serving the commit the build job tested, or a newer one.
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the live site serves this commit
        env:
          WANT: ${{ needs.build.outputs.sha }}
        run: |
          seen=nothing
          for i in $(seq 1 40); do
            got="$(curl -fsS --max-time 10 "https://mcpclients.dev/version.json?t=$i" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit)}catch{}})' || true)"
            # Only a full commit hash reaches git: the response is outside input
            if printf '%s' "$got" | grep -Eqx '[0-9a-f]{40}'; then
              seen="$got"
              [ "$got" = "$WANT" ] && { echo "mcpclients.dev serves $WANT"; exit 0; }
              # A later push already deployed: that commit contains this one
              git fetch -q origin main
              git merge-base --is-ancestor "$WANT" "$got" 2>/dev/null && { echo "mcpclients.dev serves $got, which contains $WANT"; exit 0; }
            fi
            sleep 15
          done
          echo "::error::mcpclients.dev serves $seen, expected $WANT. Check the Workers Builds run for this commit in the Cloudflare dashboard."
          exit 1
