# On every push to a branch other than main, rebuild the README sections, EVIDENCE.md,
# the history snapshot, the badges and the PNG charts from data/, and commit the result back.
# Commits made with GITHUB_TOKEN start no new push runs, so this cannot loop. It then starts
# the check workflow on the new commit, because a GITHUB_TOKEN push does not start it either.
name: build
on:
  push:
    branches-ignore: [main]
permissions:
  contents: write
  actions: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build tables and charts
        run: CHROME_PATH="$(command -v google-chrome)" npm run build
      - name: Commit generated files
        id: commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add README.md EVIDENCE.md data/history assets
          if git diff --cached --quiet; then
            echo "Generated files already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate tables and charts from data/"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Check the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        # Best effort: the npm run check step below already validates this commit
        run: gh workflow run check.yml --ref "$BRANCH" || echo "::warning::Could not start the check workflow on the regenerated commit"
      - run: npm run check
